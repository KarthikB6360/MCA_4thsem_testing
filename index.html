<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Admin Dashboard</title>

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#00e5ff;
    --secondary:#8b5cf6;
    --pink:#ff2ea6;
    --dark:#050816;
    --text:#ffffff;
    --soft:#cbd5e1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    color:white;

    background:
        linear-gradient(-45deg,#050816,#0b1120,#111827,#1e1b4b);

    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    top:-50%;
    left:-50%;

    background:
        radial-gradient(circle,#00e5ff22 0%,transparent 20%),
        radial-gradient(circle,#8b5cf622 0%,transparent 20%),
        radial-gradient(circle,#ff2ea622 0%,transparent 20%);

    background-size:300px 300px;
    animation:particles 25s linear infinite;
    z-index:-5;
}

@keyframes particles{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(200px,150px);
    }
}

@keyframes bgMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    padding:30px;
}

/* ================= TOPBAR ================= */

.topbar{
    width:100%;
    padding:30px;
    border-radius:30px;

    background:rgba(255,255,255,0.06);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.12);

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;

    margin-bottom:35px;

    box-shadow:
        0 0 30px rgba(0,229,255,0.12),
        0 0 70px rgba(139,92,246,0.08);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    width:85px;
    height:85px;
    border-radius:25px;

    background:linear-gradient(135deg,#00e5ff,#8b5cf6);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    box-shadow:
        0 0 30px rgba(0,229,255,0.35);
}

.logo-text h1{
    font-family:'Orbitron',sans-serif;
    font-size:2.2rem;

    background:linear-gradient(to right,#00e5ff,#fff,#ff2ea6);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-text p{
    color:#cbd5e1;
    margin-top:6px;
}

.total-box{
    padding:20px 35px;
    border-radius:25px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    text-align:center;
}

.total-box h2{
    color:#00e5ff;
    font-size:2.5rem;
}

.total-box p{
    color:#cbd5e1;
}

/* ================= TABLE ================= */

.project-grid{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1500px;

    border-collapse:collapse;

    background:rgba(255,255,255,0.06);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:25px;
    overflow:hidden;

    box-shadow:
        0 0 30px rgba(0,229,255,0.08),
        0 0 60px rgba(139,92,246,0.05);
}

/* ================= HEAD ================= */

thead{
    background:linear-gradient(135deg,#00e5ff,#8b5cf6);
}

thead th{
    padding:22px;
    text-align:left;
    font-size:15px;
    font-weight:600;
    color:white;
    letter-spacing:0.5px;
}

/* ================= BODY ================= */

tbody tr{
    border-bottom:1px solid rgba(255,255,255,0.08);
    transition:0.3s ease;
}

tbody tr:hover{
    background:rgba(255,255,255,0.05);
}

tbody td{
    padding:18px;
    color:#e2e8f0;
    font-size:14px;
    vertical-align:top;
    line-height:1.7;
}

/* ================= BADGE ================= */

.usn-badge{
    display:inline-block;

    padding:8px 15px;

    border-radius:100px;

    background:rgba(0,229,255,0.12);

    color:#00e5ff;

    border:1px solid rgba(0,229,255,0.25);

    font-size:13px;
    font-weight:600;
}

/* ================= LINK ================= */

.github-link{
    color:#00e5ff;
    text-decoration:none;
    font-weight:500;
}

/* ================= LOADER ================= */

.loader{
    text-align:center;
    margin-top:120px;
}

.loader i{
    font-size:60px;
    color:#00e5ff;
    animation:spin 1.2s linear infinite;
}

.loader p{
    margin-top:20px;
    font-size:18px;
    color:#cbd5e1;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .container{
        padding:18px;
    }

    .topbar{
        justify-content:center;
        text-align:center;
    }

    .logo-area{
        flex-direction:column;
    }

    .logo-text h1{
        font-size:1.7rem;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="logo-area">

            <div class="logo">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <div class="logo-text">
                <h1>ADMIN DASHBOARD</h1>
                <p>MCA-CIT</p>
            </div>

        </div>

        <div class="total-box">
            <h2 id="totalCount">0</h2>
            <p>Total Submissions</p>
        </div>

    </div>

    <!-- LOADER -->

    <div class="loader" id="loader">
        <i class="fa-solid fa-spinner"></i>
        <p>Loading Firebase Data...</p>
    </div>

    <!-- TABLE AREA -->

    <div class="project-grid" id="projectGrid"></div>

</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

// ================= FIREBASE IMPORTS =================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ================= FIREBASE CONFIG =================

const firebaseConfig = {

    apiKey: "AIzaSyCAJ9dE7uTu_7zoPLa-8R3w1ex-Q5F1Y4I",

    authDomain: "mca-assignment-portal.firebaseapp.com",

    projectId: "mca-assignment-portal",

    storageBucket: "mca-assignment-portal.firebasestorage.app",

    messagingSenderId: "177988783305",

    appId: "1:177988783305:web:488262e5457b5911559118",

    measurementId: "G-EY1ZFHYW5V"
};


// ================= INITIALIZE =================

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


// ================= HTML ELEMENTS =================

const projectGrid = document.getElementById("projectGrid");

const loader = document.getElementById("loader");

const totalCount = document.getElementById("totalCount");


// ================= LOAD DATA =================

async function loadProjects(){

    try{

        const q = query(
            collection(db,"project_assignments"),
            orderBy("submittedAt","desc")
        );

        const querySnapshot = await getDocs(q);

        loader.style.display = "none";

        let total = 0;

        let tableHTML = `

        <table>

            <thead>

                <tr>

                    <th>USN</th>

                    <th>Student Name</th>

                    <th>Email</th>

                    <th>Section</th>

                    <th>Phone</th>

                    <th>Technologies</th>

                    <th>Description</th>

                    <th>GitHub</th>

                </tr>

            </thead>

            <tbody>

        `;

        querySnapshot.forEach((doc)=>{

            total++;

            const data = doc.data();

            tableHTML += `

            <tr>

                <td>
                    <span class="usn-badge">
                        ${data.usn || "-"}
                    </span>
                </td>

                <td>
                    ${data.fullName || "-"}
                </td>

                <td>
                    ${data.email || "-"}
                </td>

                <td>
                    ${data.section || "-"}
                </td>

                <td>
                    ${data.phone || "-"}
                </td>

                <td>
                    ${data.technologies || "-"}
                </td>

                <td>
                    ${data.description || "-"}
                </td>

                <td>

                    <a href="${data.github}"
                       target="_blank"
                       class="github-link">

                       Open Link

                    </a>

                </td>

            </tr>

            `;

        });

        tableHTML += `
            </tbody>
        </table>
        `;

        projectGrid.innerHTML = tableHTML;

        totalCount.innerText = total;

    }

    catch(error){

        console.error(error);

        loader.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>${error.message}</p>
        `;
    }
}

loadProjects();

</script>

</body>
</html>
